<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:type" content="website">
<meta property="og:title" content="Sindicatul National TESA – protectia ta la locul de munca">
<meta property="og:description" content="Sindicatul National TESA reprezinta personalul tehnic, economic si administrativ din spitalele publice: salarizare corecta pe Anexa VII, indrumare legala si o voce la nivel national.">

<style>
body{margin:0;background:#FFF9EF}
a{color:#255ECF}a:hover{color:#094F8E}
.lift{transition:transform .25s ease, box-shadow .25s ease}
.lift:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(3,3,125,.16)}
.zoom{overflow:hidden}
.zoom img{transition:transform .6s ease}
.zoom:hover img{transform:scale(1.06)}
.btn{transition:transform .2s ease, box-shadow .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(3,3,125,.22)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.rise1{animation:rise .8s ease both}
.rise2{animation:rise .8s .15s ease both}
.rise3{animation:rise .8s .3s ease both}
.rise4{animation:rise .9s .45s ease both}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bob{animation:bob 2.8s ease-in-out infinite}
@media (max-width: 640px){
[style*="font-size: 56px"]{font-size:36px !important}
[style*="font-size: 48px"]{font-size:32px !important}
[style*="font-size: 44px"]{font-size:32px !important}
[style*="font-size: 40px"]{font-size:30px !important}
[style*="font-size: 30px"]{font-size:24px !important}
blockquote[style*="font-size: 28px"]{font-size:20px !important}
nav[aria-label="Navigare principala"]{gap:8px 16px !important;font-size:14px !important}
}
@media (prefers-reduced-motion: reduce){.rise1,.rise2,.rise3,.rise4,.bob{animation:none}.lift,.zoom img,.btn{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: 'Work Sans', system-ui, sans-serif; color: #1C2B3A; background: #FFF9EF; line-height: 1.55; font-size: 17px">

<div aria-hidden="true" style="height: 6px; display: flex"><div style="flex: 1 1 0; background: #255ECF"></div><div style="flex: 1 1 0; background: #FFCD2E"></div><div style="flex: 1 1 0; background: #C8102E"></div></div>
<header style="background: #FFF9EF; border-bottom: 1px solid #EFE2CC">
<div style="max-width: 1180px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<img src="sigla-snt.png" alt="Sigla Sindicatului National TESA" style="width: 64px; height: auto; display: block">
<div style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 20px; line-height: 1.2; color: #03037D">Sindicatul National TESA</div>
</div>
<nav aria-label="Navigare principala" style="display: flex; flex-wrap: wrap; gap: 22px; font-size: 15px; font-weight: 500">
<a href="#despre" style="color: #1C2B3A; text-decoration: none">Despre noi</a>
<a href="#activitate" style="color: #1C2B3A; text-decoration: none">Ce facem</a>
<a href="#verifica" style="color: #1C2B3A; text-decoration: none">Test rapid</a>
<a href="#membru" style="color: #1C2B3A; text-decoration: none">Devino membru</a>
<a href="#intrebari" style="color: #1C2B3A; text-decoration: none">Intrebari</a>
<a href="#documente" style="color: #1C2B3A; text-decoration: none">Documente</a>
<a href="#contactat" style="color: #1C2B3A; text-decoration: none">Te sunam noi</a>
<a href="#contact" style="color: #1C2B3A; text-decoration: none">Contact</a>
</nav>
</div>
</header>

<section style="background: #255ECF; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; right: -120px; top: -140px; width: 560px; height: 560px; opacity: 0.08; pointer-events: none">
<div style="position: absolute; left: 190px; top: 0; width: 180px; height: 560px; background: #FFFFFF"></div>
<div style="position: absolute; left: 0; top: 190px; width: 560px; height: 180px; background: #FFFFFF"></div>
</div>
<div style="position: relative; max-width: 1180px; margin: 0 auto; padding: 80px 24px 96px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
<div style="flex: 999 1 520px; min-width: 0">
<div class="rise1" style="display: inline-block; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #03037D; background: #FFCD2E; border-radius: 999px; padding: 6px 14px; font-weight: 600; margin-bottom: 22px">Sindicatul National TESA · personal din sanatate</div>
<h1 class="rise2" style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 1.06; margin: 0 0 24px; color: #FFFFFF">Am obtinut incadrarea pe <span style="color: #FFCD2E">Anexa VII</span> in aproape toate spitalele unde avem membri.</h1>
<p class="rise3" style="font-size: 20px; margin: 0 0 36px; color: #EEF2FD; max-width: 640px">Suntem vocea personalului TESA si auxiliar din spitale: negociem cu ministerele, te indrumam cand ti se refuza un drept si nu te lasam singur. Ti s-a refuzat incadrarea corecta? Scrie-ne.</p>
<div class="rise4" style="display: flex; flex-wrap: wrap; gap: 14px">
<a class="btn" href="#membru" style="background: #FFCD2E; color: #03037D; text-decoration: none; padding: 16px 30px; border-radius: 999px; font-weight: 700; font-size: 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Devino membru</a>
<a class="btn" href="#rezultate" onClick="{{openMap}}" style="background: #FFFFFF; color: #03037D; text-decoration: none; padding: 16px 30px; border-radius: 999px; font-weight: 600; font-size: 18px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">Vezi ce am obtinut</a>
</div>
</div>
<div class="rise3" style="flex: 1 1 380px; min-width: 0; position: relative; padding: 0 0 56px 0">
<div style="position: relative; border-radius: 20px; box-shadow: 14px 14px 0 #FFCD2E">
<img src="strada.jpg" alt="Reprezentant al sindicatului facand declaratii presei, in vesta albastra cu insemnele TESA" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 20px">
</div>
<div style="position: absolute; left: -18px; bottom: 0; width: 46%; border: 6px solid #FFFFFF; border-radius: 16px; overflow: hidden; box-shadow: 0 12px 28px rgba(3,3,125,.3)">
<img src="conferinta.jpg" alt="Conferinta nationala Uniunea TESA" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover">
</div>
<div style="position: absolute; right: 12px; bottom: 16px; background: #03037D; color: #FFFFFF; border-radius: 14px; padding: 12px 18px; font-size: 14px; line-height: 1.3; box-shadow: 0 10px 24px rgba(0,0,0,.25)"><span style="display: block; font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; font-weight: 700; color: #FFCD2E">In strada</span>cand a fost nevoie</div>
</div>
</div>
</section>

<section aria-label="Pe scurt" style="background: #FFCD2E">
<div style="max-width: 1180px; margin: 0 auto; padding: 28px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 32px">
<div style="display: flex; align-items: baseline; gap: 12px"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 48px; font-weight: 700; color: #03037D; line-height: 1; font-variant-numeric: tabular-nums">{{n1}}</span><span style="color: #03037D; font-weight: 500">membri in unitati sanitare</span></div>
<div style="display: flex; align-items: baseline; gap: 12px"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 48px; font-weight: 700; color: #03037D; line-height: 1; font-variant-numeric: tabular-nums">{{n2}}</span><span style="color: #03037D; font-weight: 500">unitati sanitare din 6 judete</span></div>
<div style="display: flex; align-items: baseline; gap: 12px"><span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 48px; font-weight: 700; color: #03037D; line-height: 1">2024</span><span style="color: #03037D; font-weight: 500">anul infiintarii</span></div>
</div>
</section>

<section id="despre" style="max-width: 1180px; margin: 0 auto; padding: 96px 24px 72px; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 320px; min-width: 0">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #C8102E; font-weight: 600; margin-bottom: 12px">Despre noi</div>
<h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 40px; line-height: 1.15; margin: 0 0 28px; color: #03037D">Cine suntem</h2>
<figure class="zoom" style="margin: 0; border-radius: 16px; box-shadow: 10px 10px 0 #FFCD2E"><img src="infiintare.jpg" alt="Membrii fondatori la intalnirea de infiintare a Sindicatului National TESA, in jurul mesei, cu steagurile TESA" style="display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 16px"></figure>
<p style="margin: 18px 0 0; font-size: 14px; color: #4B5B6B">Intalnirea de infiintare a Sindicatului National TESA, 2024</p>
</div>
<div style="flex: 999 1 560px; min-width: 0; font-size: 18px">
<p style="margin: 0 0 18px">Sindicatul National TESA reprezinta economistii, juristii, informaticienii, personalul administrativ si auxiliar din unitatile sanitare publice: colegii fara de care un spital nu poate functiona, dar care sunt prea des uitati in legile de salarizare.</p>
<p style="margin: 0 0 18px">Suntem afiliati la Uniunea Nationala a Sindicatelor TESA din Sanatate, singura federatie dedicata in totalitate personalului TESA din sanatate, si, prin intermediul ei, la Confederatia MERIDIAN. Prin federatie si confederatie, participam la dialogul social la nivel national.</p>
<p style="margin: 0; color: #4B5B6B">Infiintat in 2024 · Presedinte: Chifor Valentin Liviu · Secretar general: Oana Toader · Sediul: Bucuresti, sector 6</p>
</div>
</section>

<section aria-label="Mesajul nostru" style="background: #03037D; color: #FFFFFF; position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 10px; display: flex; flex-direction: column"><div style="flex: 1 1 0; background: #255ECF"></div><div style="flex: 1 1 0; background: #FFCD2E"></div><div style="flex: 1 1 0; background: #C8102E"></div></div>
<div style="max-width: 1180px; margin: 0 auto; padding: 88px 24px 88px 48px">
<div style="font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #FFCD2E; font-weight: 600; margin-bottom: 20px">Campania nationala „Munca nevazuta”</div>
<p style="font-family: 'Source Serif 4', Georgia, serif; font-size: 48px; line-height: 1.15; font-weight: 700; margin: 0; max-width: 980px">O campanie despre oamenii <span style="color: #FFCD2E">fara de care spitalul nu functioneaza.</span></p>
<p style="margin: 24px 0 0; font-size: 19px; color: #C9CDF2; max-width: 720px">Economisti, juristi, informaticieni, administratie, personal de suport. Munca noastra nu se vede in saloane, dar fara ea niciun pacient nu poate fi internat, tratat sau externat.</p>
</div>
</section>

<section id="unitati" style="max-width: 1180px; margin: 0 auto; padding: 88px 24px">
<div style="display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: flex-end; justify-content: space-between; margin-bottom: 28px">
<div style="flex: 999 1 480px; min-width: 0">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #C8102E; font-weight: 600; margin-bottom: 12px">Unde suntem</div>
<h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 40px; line-height: 1.15; margin: 0 0 12px; color: #03037D">14 unitati sanitare, 6 judete</h2>
<p style="margin: 0; font-size: 18px; color: #33475B">Cauta-ti spitalul. Daca avem deja colegi acolo, nu esti singur.</p>
</div>
<div style="flex: 1 1 300px; min-width: 0">
<label for="cauta-spital" style="display: block; font-weight: 600; color: #03037D; margin-bottom: 6px">Cauta spitalul tau</label>
<input id="cauta-spital" type="search" placeholder="ex. Campina, Filantropia, Sibiu" value="{{uQuery}}" onChange="{{onUQuery}}" style="font: inherit; width: 100%; box-sizing: border-box; padding: 12px 14px; border: 2px solid #A9C1EF; border-radius: 10px; color: #1C2B3A; background: #FFFFFF">
</div>
</div>
<div role="group" aria-label="Filtreaza dupa judet" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px">
<sc-for list="{{uChips}}" as="c" hint-placeholder-count="7"><button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 2px solid #255ECF; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px">
<sc-for list="{{uList}}" as="u" hint-placeholder-count="14">
<div class="lift" style="background: #FFFFFF; border: 1px solid #EFE2CC; border-radius: 14px; padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start">
<span aria-hidden="true" style="flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; background: #FFF4CC; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#255ECF"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"></path></svg></span>
<span><span style="display: block; font-weight: 600; color: #03037D; line-height: 1.3">{{u.n}}</span><span style="font-size: 14px; color: #6B6455">{{u.loc}}</span></span>
</div>
</sc-for>
</div>
<sc-if value="{{uEmpty}}" hint-placeholder-val="{{false}}">
<div class="rise1" style="background: #03037D; color: #FFFFFF; border-radius: 16px; padding: 28px; margin-top: 8px">
<p style="margin: 0 0 8px; font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; font-weight: 700; color: #FFCD2E">Spitalul tau nu e inca pe lista?</p>
<p style="margin: 0 0 18px; color: #DDE1F7">Poti fi primul membru de acolo. Scrie-ne si iti spunem cum putem lucra impreuna.</p>
<a class="btn" href="https://wa.me/40728294825?text=Buna%20ziua!%20Lucrez%20intr-un%20spital%20unde%20sindicatul%20nu%20are%20inca%20membri%20si%20as%20dori%20detalii." target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 44px; background: #FFCD2E; color: #03037D; text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 999px">Scrie-ne pe WhatsApp</a>
</div>
</sc-if>
<sc-if value="{{uNotEmpty}}" hint-placeholder-val="{{true}}">
<p style="margin: 20px 0 0; color: #33475B">Lucrezi in alt spital? <a href="https://wa.me/40728294825?text=Buna%20ziua!%20Lucrez%20intr-un%20spital%20unde%20sindicatul%20nu%20are%20inca%20membri%20si%20as%20dori%20detalii." target="_blank" rel="noopener" style="font-weight: 600">Poti fi primul membru de acolo.</a></p>
</sc-if>
</section>

<section id="activitate" style="background: #FFEFD6">
<div style="max-width: 1180px; margin: 0 auto; padding: 88px 24px">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #C8102E; font-weight: 600; margin-bottom: 12px">Activitate</div>
<h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 40px; line-height: 1.15; margin: 0 0 44px; color: #03037D">Ce facem pentru membri</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px">
<div class="lift" style="background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
<div style="width: 52px; height: 52px; border-radius: 50%; background: #FFF4CC; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#03037D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"></path></svg></div>
<h3 style="font-size: 20px; margin: 0; color: #03037D">Salarizare corecta</h3>
<p style="margin: 0; color: #4B5B6B">Analize, simulari si propuneri pentru legea salarizarii, sustinute in negocierile cu ministerele.</p>
</div>
<div class="lift" style="background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
<div style="width: 52px; height: 52px; border-radius: 50%; background: #FFF4CC; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#03037D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"></path></svg></div>
<h3 style="font-size: 20px; margin: 0; color: #03037D">Apararea drepturilor</h3>
<p style="margin: 0; color: #4B5B6B">Consultanta si sprijin in conflicte de munca, sanctiuni disciplinare sau modificari ale contractului.</p>
</div>
<div class="lift" style="background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
<div style="width: 52px; height: 52px; border-radius: 50%; background: #FFF4CC; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#03037D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h4l6 5V5L7 10z"></path><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"></path></svg></div>
<h3 style="font-size: 20px; margin: 0; color: #03037D">Voce la nivel national</h3>
<p style="margin: 0; color: #4B5B6B">Problemele din spitalul tau ajung direct la ministere si la partide, prin Uniunea TESA si Confederatia MERIDIAN.</p>
</div>
<div class="lift" style="background: #FFFFFF; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
<div style="width: 52px; height: 52px; border-radius: 50%; background: #FFF4CC; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#03037D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="9" r="3"></circle><circle cx="16" cy="9" r="3"></circle><path d="M2 20c0-3 3-5 6-5s6 2 6 5M14 15c3 0 8 1 8 5"></path></svg></div>
<h3 style="font-size: 20px; margin: 0; color: #03037D">Dialog social</h3>
<p style="margin: 0; color: #4B5B6B">Participam la dialogul social national si european si invatam din practica altor tari, inclusiv prin proiecte cu finantare europeana.</p>
</div>
</div>
</div>
</section>

<section id="protectie" style="max-width: 1180px; margin: 0 auto; padding: 88px 24px 0">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #C8102E; font-weight: 600; margin-bottom: 12px">Singur sau impreuna?</div>
<h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 40px; line-height: 1.15; margin: 0 0 12px; color: #03037D">Sindicatul este protectia ta la locul de munca</h2>
<p style="margin: 0 0 36px; font-size: 18px; color: #33475B; max-width: 760px">Un angajat singur negociaza greu. O comunitate organizata are acces la informatie, la sprijin juridic si la masa negocierilor.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">
<div style="background: #F1ECE4; border-radius: 20px; padding: 32px">
<h3 style="font-size: 22px; margin: 0 0 20px; color: #4B5B6B">Singur</h3>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; color: #33475B">
<li style="display: flex; gap: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A96A6" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><path d="M6 6l12 12M18 6L6 18"></path></svg><span>Afli tarziu ce se schimba in legea salarizarii si ce inseamna pentru tine.</span></li>
<li style="display: flex; gap: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A96A6" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><path d="M6 6l12 12M18 6L6 18"></path></svg><span>Cand ti se refuza un drept, cauti singur temeiul legal si pasii de urmat.</span></li>
<li style="display: flex; gap: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A96A6" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="flex: 0 0 auto; margin-top: 2px"><path d="M6 6l12 12M18 6L6 18"></path></svg><span>Intr-un conflict de munca sau la o sanctiune, esti singur in fata conducerii.</span></li>

<p style="margin: 0 0 40px; font-size: 18px; max-width: 760px; color: #33475B">Personalul TESA a fost mult timp „munca nevazuta” a spitalelor. Am pornit de la un lucru simplu: nimeni nu tine un spital in functiune singur. De aici a inceput drumul nostru, din spital in spital si pana la masa negocierilor cu ministerele.</p>

<div aria-hidden="true" style="font-family: 'Source Serif 4', Georgia, serif; font-size: 120px; line-height: 0.6; color: #FFCD2E; height: 48px">“</div>
<blockquote style="margin: 0 0 32px; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; line-height: 1.45; font-weight: 600">
<p style="margin: 0 0 18px">Am venit in sindicat cu o intrebare pe care si-o pun multi colegi: de ce munca noastra, a celor care tinem spitalul in functiune din birouri, pare sa conteze mai putin atunci cand vine vorba de salarizare?</p>
<p style="margin: 0 0 18px">Am gasit aici mai mult decat un raspuns. Am gasit oameni competenti, care au studiat legi, decizii ale Inaltei Curti si hotarari judecatoresti pana au identificat cele mai bune solutii pentru personalul TESA, si care au avut apoi rabdarea si tenacitatea sa le duca pana la capat.</p>
<p style="margin: 0">Am gasit sprijin, raspunsuri clare si colegi pe care ma pot baza. Aici mi-am gasit locul.</p>
</blockquote>
<figcaption style="display: flex; align-items: center; gap: 16px">
<img src="oana-toader.jpg" alt="Oana Toader" style="flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid #FFCD2E">
<span><span style="display: block; font-weight: 700; font-size: 18px">Oana Toader</span><span style="color: #DDE6FA; font-size: 15px">Economist, Spitalul Municipal Campina · Secretar general SNT</span></span>
</figcaption>
</figure>
</sc-if>
<sc-if value="{{t1}}" hint-placeholder-val="{{false}}">
<figure class="rise1" style="margin: 0">
<div aria-hidden="true" style="font-family: 'Source Serif 4', Georgia, serif; font-size: 120px; line-height: 0.6; color: #FFCD2E; height: 48px">“</div>
<blockquote style="margin: 0 0 32px; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; line-height: 1.45; font-weight: 600">
<p style="margin: 0 0 18px">Ca jurist, am vazut de prea multe ori cum o lege neclara devine o nedreptate pentru oamenii care isi fac treaba cu seriozitate. Personalul TESA din spitale a fost tratat diferit, desi munca lui sustine in fiecare zi actul medical, iar instantele au confirmat asta in repetate randuri.</p>
<p style="margin: 0">Am venit alaturi de colegii TESA pentru ca dreptatea nu se obtine doar in sala de judecata, ci si scriind legi corecte. Amendamentul nostru la noua lege a salarizarii inseamna exact asta: argumente juridice solide, puse in slujba oamenilor.</p>
</blockquote>
<figcaption style="display: flex; align-items: center; gap: 16px">
<img src="laura-jeculescu.jpg" alt="Laura Jeculescu" style="flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 3px solid #FFCD2E">
<span><span style="display: block; font-weight: 700; font-size: 18px">Laura Jeculescu</span><span style="color: #DDE6FA; font-size: 15px">Jurist · Vicepresedinte SNT</span></span>
</figcaption>
</figure>

<section id="intrebari" style="max-width: 1180px; margin: 0 auto; padding: 88px 24px 0; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 300px; min-width: 0">
<div style="font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #C8102E; font-weight: 600; margin-bottom: 12px">Intrebari frecvente</div>
<h2 style="font-family: 'Source Serif 4', Georgia, serif; font-size: 40px; line-height: 1.15; margin: 0 0 16px; color: #03037D">Inainte sa te inscrii</h2>
<p style="margin: 0; color: #4B5B6B">Nu ai gasit raspunsul? <a href="mailto:nationaltesa@gmail.com?subject=Intrebare%20despre%20inscriere">Scrie-ne</a>.</p>
</div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<details style="background: #FFFFFF; border: 1px solid #EFE2CC; border-radius: 12px; padding: 18px 22px">
<summary style="cursor: pointer; font-weight: 600; color: #03037D; font-size: 18px">Afla angajatorul ca sunt membru de sindicat?</summary>
<p style="margin: 12px 0 0">Da. Cotizatia se retine direct pe statul de plata, cu acordul tau scris din cererea de adeziune, asa ca serviciul de salarizare afla ca esti membru. Angajatorul primeste doar datele necesare retinerii cotizatiei.</p>
</details>
<details style="background: #FFFFFF; border: 1px solid #EFE2CC; border-radius: 12px; padding: 18px 22px">
<summary style="cursor: pointer; font-weight: 600; color: #03037D; font-size: 18px">Pot avea probleme la serviciu pentru ca sunt membru?</summary>
<p style="margin: 12px 0 0">Nu ar trebui. Codul muncii interzice discriminarea salariatilor pe criteriul apartenentei ori activitatii sindicale, iar Legea nr. 367/2022 a dialogului social protejeaza dreptul de a face parte dintr-un sindicat. Daca te confrunti totusi cu o astfel de situatie, anunta-ne.</p>
</details>
<details style="background: #FFFFFF; border: 1px solid #EFE2CC; border-radius: 12px; padding: 18px 22px">
<summary style="cursor: pointer; font-weight: 600; color: #03037D; font-size: 18px">Sunt deja membru in alt sindicat. Ma pot inscrie?</summary>
<p style="margin: 12px 0 0">Potrivit legii, o persoana poate fi membra, in acelasi timp, a unui singur sindicat la acelasi angajator. De aceea, cererea de adeziune cuprinde declaratia ca nu esti membru al altui sindicat. Daca vrei sa treci la noi, te retragi mai intai din sindicatul actual.</p>
</details>
<details style="background: #FFFFFF; border: 1px solid #EFE2CC; border-radius: 12px; padding: 18px 22px">
<summary style="cursor: pointer; font-weight: 600; color: #03037D; font-size: 18px">Cat ma costa?</summary>
<p style="margin: 12px 0 0">Cotizatia este de 0,5% din salariul brut, retinuta lunar pe statul de plata. La un salariu brut de 6.000 lei, inseamna 30 lei pe luna.</p>
</details>
<details style="background: #FFFFFF; border: 1px solid #EFE2CC; border-radius: 12px; padding: 18px 22px">
<summary style="cursor: pointer; font-weight: 600; color: #03037D; font-size: 18px">Daca ma razgandesc, ma pot retrage?</summary>
<p style="margin: 12px 0 0">Da. Nimeni nu poate fi obligat sa ramana membru al unui sindicat. Te poti retrage oricand, printr-o cerere scrisa adresata sindicatului, conform Statutului.</p>
</details>
<details style="background: #FFFFFF; border: 1px solid #EFE2CC; border-radius: 12px; padding: 18px 22px">
<summary style="cursor: pointer; font-weight: 600; color: #03037D; font-size: 18px">Ce este, pe scurt, Anexa VII si de ce conteaza?</summary>
<p style="margin: 12px 0 0">Anexa VII este grila de salarizare care, potrivit Deciziei ICCJ nr. 61/2022, se aplica personalului TESA din spitalele publice. In practica, multe spitale nu au aplicat-o. Daca nu stii pe ce anexa esti platit sau ti s-a refuzat incadrarea, scrie-ne si te indrumam.</p>
</details>
</div>
</section>

    };
